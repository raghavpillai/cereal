name: meeting-notes
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meeting_notes
      POSTGRES_USER: meeting_notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/setup.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_notes -d meeting_notes"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    image: meeting-notes:local
    build: .
    command: ["bun", "run", "--cwd", "packages/database", "migrate"]
    environment:
      DATABASE_URL: postgresql://meeting_notes:${POSTGRES_PASSWORD}@db:5432/meeting_notes?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    image: meeting-notes:local
    build: .
    # The whole private .env is handed to the server, and the entries under `environment` win over it.
    # Provider keys, models, sign-in, storage and the apps are set on the admin panel and kept in the
    # database, so nothing here names them. A .env from an earlier version that still carries such values
    # (OPENROUTER_API_KEY, OPENROUTER_MODEL and so on) is read once: the server takes them into its settings
    # at start-up, says so in its log by name, and never reads them again.
    env_file: .env
    environment:
      DATABASE_URL: postgresql://meeting_notes:${POSTGRES_PASSWORD}@db:5432/meeting_notes?schema=public
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Run ./scripts/setup.sh first}
      AUDIO_STORAGE_DIR: /data/audio
      DOWNLOADS_DIR: /data/downloads
      SETTINGS_KEY_FILE: /data/state/settings.key
      # Where the server finds the updater's folder (the last volume below). It wins over the host path that
      # UPDATER_DIR has in .env.
      UPDATER_DIR: /data/updater
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - audio-data:/data/audio
      - state-data:/data/state
      # App builds this server hands out (GET /api/v1/downloads). scripts/release-macos.sh writes them to
      # ./dist/release, so a build made on this machine is published by being there. Read-only: the server
      # never writes here. Docker creates the directory if it does not exist yet (scripts/setup.sh makes it
      # first, so that it belongs to you).
      - ${DOWNLOADS_HOST_DIR:-./dist/release}:/data/downloads:ro
      # "Update server" on the admin panel. The server holds no Docker socket: it leaves a signed request in
      # this folder and reads the progress that scripts/updater.sh, running on the host, writes there.
      # `./scripts/updater.sh install` sets UPDATER_DIR and UPDATER_TOKEN in .env; until then this is an empty
      # folder and the panel says the updater is not installed.
      - ${UPDATER_DIR:-./dist/updater}:/data/updater
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/api/v1/ready');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
  audio-data:
  state-data:
