name: Checks
# Pushes to main, and pull requests. A branch with an open PR is checked once, not twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Each job below runs only when its part of the repo changed. Generated contracts are committed into
  # crates/ and apps/ios/, so a contract change reaches the apps that use it through those paths.
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.server }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop }}
      ios: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/**
            server:
              - *ci
              - apps/api/**
              - apps/web/**
              - packages/**
              - crates/**
              - scripts/**
              - package.json
              - bun.lock
              - tsconfig*.json
            desktop:
              - *ci
              - apps/desktop/**
              - crates/**
              - Cargo.toml
              - Cargo.lock
            ios:
              - *ci
              - apps/ios/**
              - scripts/select-ios-simulator.py
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meeting_notes
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: mn_test_c1
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meeting_notes -d mn_test_c1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The PostgreSQL suites only run against a database named mn_test_<hex>, so they can never touch a real one.
      DATABASE_URL: postgresql://meeting_notes:ci-only@127.0.0.1:5432/mn_test_c1?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check:generated
      - run: bun run --cwd packages/database generate
      - run: bun run db:migrate
      - run: bun run check
      - run: bun test
      - name: PostgreSQL suites
        env:
          RUN_PG_TESTS: "1"
          RUN_AUTH_PG_TESTS: "1"
        # Same grouping as scripts/test-postgres-isolated.ts: the sign-in suites share an in-memory
        # rate limiter, and the 500-note benchmark and the 24 MB note import each need a process to themselves.
        run: |
          separate='/(auth|sign-in|mcp-auth|organizations|note-summaries|import)-postgres\.test\.ts$'
          bun test --timeout 30000 ./apps/api/test/auth-postgres.test.ts
          bun test --timeout 30000 ./apps/api/test/sign-in-postgres.test.ts
          bun test --timeout 30000 $(ls apps/api/test/*.test.ts | grep -v -E "$separate" | sed 's|^|./|')
          bun test --timeout 30000 ./apps/api/test/note-summaries-postgres.test.ts
          bun test --timeout 30000 ./apps/api/test/import-postgres.test.ts
          bun test --timeout 30000 ./apps/api/test/mcp-auth-postgres.test.ts
          bun test --timeout 30000 ./apps/api/test/organizations-postgres.test.ts
      - run: bun run build
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p meeting-notes-api-types --locked
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test -p cereal --locked
      # Release builds leave out debug-only code; a call into it compiles in tests and fails only here.
      - run: cargo build -p cereal --release --locked
  # The Swift package tests and the app tests share one macOS runner.
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apps/ios/Packages/APIClient
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate app and widget project
        run: xcodegen generate --spec apps/ios/project.yml
      - name: Select an available iOS 26 iPhone
        id: simulator
        run: |
          SIMULATOR_ID=$(python3 scripts/select-ios-simulator.py)
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
      - name: Test signed simulator app and build recording widget
        run: >-
          xcodebuild -project apps/ios/Cereal.xcodeproj -scheme Cereal
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}"
          -derivedDataPath "$RUNNER_TEMP/CerealDerivedData"
          -resultBundlePath "$RUNNER_TEMP/CerealTests.xcresult"
          test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/CerealTests.xcresult
